server {
    listen       80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    ### Route backend requests to prevent CORS issues.
    ### These should be in sync with runtime-config.js
    location /api {
        proxy_pass http://job-repository-service:8000/api;
    }
    location /odata {
        proxy_pass http://job-repository-service:8000/odata;
    }
    location /JobPublisher {
        proxy_pass http://job-producer-service:8000/JobPublisher;
    }
}
